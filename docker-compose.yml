version: '3.8'

services:
  app:
    build: .
    container_name: drawing-app
    ports:
      - "8080:8080"
    environment:
      # compose의 mongo 컨테이너에 연결 (Atlas 등 다른 DB를 쓰려면 이 값을 바꾼다)
      - MONGODB_URI=mongodb://mongo:27017/drawing-app
      - SERVER_PORT=8080
    depends_on:
      - mongo # mongo 컨테이너가 뜬 후 실행
    restart: always

  mongo:
    image: mongo:latest
    container_name: drawing-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    restart: always

volumes:
  mongo-data: