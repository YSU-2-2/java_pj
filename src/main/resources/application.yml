spring:
  application:
    name: cloud-drawing-app
  data:
    mongodb:
      # 접속 주소는 환경변수 MONGODB_URI로 주입 (코드에 계정·비밀번호를 쓰지 않는다)
      uri: ${MONGODB_URI:mongodb://localhost:27017/drawing-app}
      database: drawing-app

server:
  port: 8080

# DynamoDB 설정
# aws:
#   dynamodb:
#     endpoint: http://localhost:8000
#     region: ap-northeast-2

# AWS S3 설정 (추후 설정)
# aws:
#   s3:
#     bucket-name: your-bucket-name
#     region: ap-northeast-2
#     access-key: ${AWS_ACCESS_KEY}
#     secret-key: ${AWS_SECRET_KEY}

# WebSocket 설정
websocket:
  allowed-origins: "*"

# Logging
logging:
  level:
    root: INFO
    com.cloudproject.drawing: DEBUG
    org.springframework.data.mongodb: DEBUG
